---
name: test examples

on:
  pull_request:
    types: ['opened', 'reopened', 'synchronize']
  merge_group:
  workflow_dispatch:

# Default to read-only; the e2e job below explicitly requests id-token for Azure OIDC login.
permissions:
  contents: read

concurrency:
  group: e2e-${{ github.event.pull_request.head.repo.full_name }}/${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  check:
    name: check for fork
    runs-on: ubuntu-latest
    steps:
      - name: Checking for Fork
        shell: pwsh
        env:
          IS_FORK: ${{ github.event.pull_request.head.repo.fork }}
        run: |
          if($env:IS_FORK -eq "true") {
            echo "### WARNING: This workflow is disabled for forked repositories. Please follow the [release branch process](https://azure.github.io/Azure-Verified-Modules/contributing/terraform/terraform-contribution-flow/#5-create-a-pull-request-to-the-upstream-repository) if end to end tests are required." >> $env:GITHUB_STEP_SUMMARY
          }

  run-e2e-tests:
    if: github.event.pull_request.head.repo.fork == false
    # Local copy of the (now removed) Azure/terraform-azurerm-avm-template reusable workflow.
    uses: $/.github/workflows/test-examples-template.yml
    name: end to end
    # The template exports every TF_VAR_* secret/variable into the test run (AVM convention), so it needs the full secrets context.
    secrets: inherit # zizmor: ignore[secrets-inherit]
    permissions:
      id-token: write # required for Azure OIDC login (prepare-credential.sh)
      contents: read # checkout only

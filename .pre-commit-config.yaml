---
# Note: AVM's own pre-commit tooling is `./avm pre-commit` (docker make target).
# This file only wires the zizmor GitHub Actions security audit into the pre-commit framework.
repos:
  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: fa412071e4f5d44d44f9e365f4676f9df92456a2  # frozen: v1.30.1
    hooks:
      - id: zizmor
        args: ["--persona", "auditor"]
